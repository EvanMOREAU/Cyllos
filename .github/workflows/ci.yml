name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cyllos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/cyllos?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
      # CI-only key (test database, no real secrets): base64 of 32 'a' bytes.
      APP_ENCRYPTION_KEY: "YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE="

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, ctype, iconv, intl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json / composer.lock
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Prepare test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Lint (yaml / twig / container)
        run: |
          php bin/console lint:yaml config translations
          php bin/console lint:twig templates
          php bin/console lint:container

      - name: Doctrine schema in sync with mappings
        run: php bin/console doctrine:schema:validate --env=test

      - name: PHPStan
        run: composer phpstan

      - name: PHP-CS-Fixer (dry-run)
        run: composer cs

      - name: PHPUnit
        run: |
          php bin/console cache:clear --env=test
          vendor/bin/phpunit
